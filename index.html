<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#e5f1e7"><title>HEX HAVEN v0.6</title><link rel="stylesheet" href="style.css"></head><body><main class="game" id="game"><canvas id="board" aria-label="육각형 퍼즐 보드"></canvas><div class="hud"><div class="brand">HEX HAVEN <span>v0.6</span></div><div class="stats"><div><small>STAGE</small><b id="stage">1</b></div><div><small>별 / 목표</small><b><span id="score">0</span> / <span id="target">0</span></b></div><div><small>남은 타일</small><b id="remaining">0</b></div></div><div class="objective" id="objective"></div><div class="meter"><div id="progress"></div></div></div><div class="tools"><button id="undo" aria-label="되돌리기" title="되돌리기">↶</button><button id="center" aria-label="중앙으로" title="중앙으로">⌖</button><button id="restart" aria-label="스테이지 재시작" title="다시 시작">⟲</button><button id="help" aria-label="도움말" title="도움말">?</button></div><div class="scorehint" id="selection">빈 칸을 터치해 미리보기</div><div class="dock"><button id="left" class="round" aria-label="왼쪽으로 60도 회전">↶</button><div id="tilegrab" role="button" tabindex="0" aria-label="다음 타일 미리보기"><canvas id="preview"></canvas><span>다음 타일</span></div><button id="right" class="round" aria-label="오른쪽으로 60도 회전">↷</button><button id="confirm" class="confirm" disabled>✓ 배치</button></div><div class="toast" id="message">빈 칸 터치 → 60° 회전 → 배치</div><button class="next" id="next" hidden>다음 스테이지 →</button><div class="dragbadge" id="dragbadge" hidden><canvas id="dragpreview"></canvas></div></main><dialog id="dialog"><h2>게임 방법</h2><p>보드의 점선 빈 칸을 터치하면 해당 위치에 타일 미리보기가 나타납니다. 같은 지형이 맞닿는 면마다 별 1개, 특별 타일은 별 2개를 받습니다. 3스테이지부터는 숲 연결 목표도 달성해야 합니다. 좌우 버튼으로 60도씩 회전하고 <b>배치</b>를 누르면 확정됩니다.</p><p>다른 빈 칸을 터치하면 미리보기 위치가 변경됩니다. 보드를 드래그하면 화면이 이동합니다. ⌖ 버튼으로 중앙에 복귀합니다.</p><button id="close">확인</button></dialog><script type="module" src="src/main.js"></script></body></html>
