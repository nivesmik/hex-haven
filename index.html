<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#e5f1e7"><title>HEX HAVEN v0.4</title><link rel="stylesheet" href="style.css"></head><body><main class="game" id="game"><canvas id="board" aria-label="육각형 퍼즐 보드"></canvas><div class="hud"><div class="brand">HEX HAVEN <span>v0.4</span></div><div class="stats"><div><small>STAGE</small><b id="stage">1</b></div><div><small>점수 / 목표</small><b><span id="score">0</span> / <span id="target">0</span></b></div><div><small>남은 타일</small><b id="remaining">0</b></div></div><div class="meter"><div id="progress"></div></div></div><div class="tools"><button id="undo" aria-label="되돌리기" title="되돌리기">↶</button><button id="center" aria-label="중앙으로" title="중앙으로">⌖</button><button id="restart" aria-label="스테이지 재시작" title="다시 시작">⟲</button><button id="help" aria-label="도움말" title="도움말">?</button></div><div class="scorehint" id="selection">타일을 끌어 빈 칸에 놓으세요</div><div class="dock"><button id="left" class="round" aria-label="왼쪽으로 120도 회전">↶</button><div id="tilegrab" role="button" tabindex="0" aria-label="현재 타일 드래그"><canvas id="preview"></canvas><span>여기서 끌어 놓기</span></div><button id="right" class="round" aria-label="오른쪽으로 120도 회전">↷</button><button id="confirm" class="confirm" disabled>✓ 배치</button></div><div class="toast" id="message">타일을 잡아 보드로 이동하세요</div><button class="next" id="next" hidden>다음 스테이지 →</button><div class="dragbadge" id="dragbadge" hidden><canvas id="dragpreview"></canvas></div></main><dialog id="dialog"><h2>게임 방법</h2><p>하단 타일을 손가락으로 잡아 보드의 빈 칸으로 끌어가세요. 손을 떼면 해당 위치에 미리보기가 고정됩니다. 회전 버튼으로 방향을 바꾸고 <b>배치</b>를 누르면 확정됩니다.</p><p>빈 칸을 직접 눌러 위치를 고를 수도 있습니다. 보드의 빈 공간을 드래그하면 화면이 이동합니다. ⌖ 버튼으로 중앙에 복귀합니다.</p><button id="close">확인</button></dialog><script type="module" src="src/main.js"></script></body></html>
