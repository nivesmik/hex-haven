<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#eaf1e7"><title>Hex Haven · Prototype</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div><small>HEX HAVEN · PROTOTYPE v0.2</small><h1>작은 세계의 조각들</h1></div><button id="help" class="secondary">게임 방법</button></header><section class="hud"><div><span>스테이지</span><strong id="stage">1</strong></div><div><span>점수</span><strong id="score">0</strong></div><div><span>목표</span><strong id="target">0</strong></div><div><span>남은 타일</span><strong id="remaining">0</strong></div></section><div class="progress"><div id="progress"></div></div><section class="game"><div class="boardwrap"><canvas id="board" aria-label="육각형 퍼즐 보드"></canvas><div class="hint">빈 칸 선택 → 보드에서 미리보기 → 회전 → 배치 확정</div></div><aside><h2>배치할 타일</h2><canvas id="preview"></canvas><div class="actions"><button id="left" class="secondary">↶ 회전</button><button id="right" class="secondary">회전 ↷</button></div><p class="sub">회전은 120°씩 · 2속성 타일 중심 · 놓기 전 예상 점수 확인</p><p id="selection" class="selection">배치 위치를 선택하세요.</p><button id="confirm" class="confirm">✓ 여기에 놓기</button><div class="actions"><button id="undo" class="secondary">↩ 되돌리기</button><button id="restart" class="secondary">처음부터</button></div><div class="legend"><span>🌿 초원</span><span>🌲 숲</span><span>💧 물</span><span>🏡 마을</span></div></aside></section><footer><span id="message">타일을 배치해 목표 점수를 달성하세요.</span><button id="next" hidden>다음 스테이지 →</button></footer><div class="info">브라우저 저장 지원 · 외부 라이브러리 없음 · 정적 GitHub Pages 배포 가능</div></main><dialog id="dialog"><div class="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><button id="close">확인</button></div></dialog><script type="module" src="src/main.js"></script></body></html>
